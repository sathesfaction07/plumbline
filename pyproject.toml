[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-classifier"
version = "0.1.0"
description = "Multimodal product classification with measured confidence calibration"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
chart = ["matplotlib>=3.8"]
bedrock = ["boto3>=1.34"]
vertex = ["google-cloud-aiplatform>=1.50"]

[project.scripts]
ai-classifier = "ai_classifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_classifier"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
