repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict

  - repo: local
    hooks:
      # The catalogue is sample data the test suite asserts against, so a broken one must
      # not reach a commit.
      - id: catalogue-loads
        name: the shipped catalogue loads cleanly
        entry: >
          python -c "import sys; sys.path.insert(0, 'src');
          from pathlib import Path;
          from ai_classifier.io import load_products, load_labels;
          p = load_products(Path('data/products.csv'));
          l = load_labels(Path('data/labels.csv'));
          assert not p.problems, p.problems;
          assert not l.problems, l.problems;
          print(f'{len(p.products)} products, {len(l.labels)} labels, 0 problems')"
        language: system
        pass_filenames: false
        files: ^data/
